<body>
<style id="login-css">* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1f4fe0; color: #fff; min-height: 100%; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; overflow: hidden; }
.login::before { content: ""; position: absolute; right: -160px; top: -120px; width: 520px; height: 520px; border-radius: 46% 54% 40% 60%; background: #f7a21b; }
.box { position: relative; width: 100%; max-width: 380px; background: #fff; color: #14183a; border-radius: 12px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px; }
.tag { display: inline-block; align-self: flex-start; background: #f7a21b; color: #1f4fe0; font-weight: 900; text-transform: uppercase; font-size: 26px; line-height: .95; padding: 4px 10px 6px; transform: rotate(-2deg); }
.box p { margin: 0; color: #5a6480; font-size: 14px; }
label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid #c9d3ee; border-radius: 8px; color: #14183a; background: #fff; }
input:focus { outline: 3px solid rgba(31,79,224,.25); border-color: #1f4fe0; }
.entrar { font: inherit; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; background: #1f4fe0; color: #fff; border: 0; border-radius: 8px; padding: 12px; cursor: pointer; }
.entrar:focus-visible { outline: 3px solid #f7a21b; outline-offset: 2px; }
.entrar[disabled] { opacity: .6; cursor: wait; }
.err { color: #c62f1a; font-size: 13px; min-height: 1.2em; margin: 0; }</style>
<template id="tpl-login"><div class="login" id="login">
  <form class="box" id="form" autocomplete="on">
    <span class="tag">Encontro<br>com Deus</span>
    <p>Inscrições · acesso restrito à rede</p>
    <label for="u">Usuário<input id="u" name="username" autocomplete="username" required></label>
    <label for="s">Senha<input id="s" name="password" type="password" autocomplete="current-password" required></label>
    <button class="entrar" id="b" type="submit">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<div id="app" hidden></div></template>

// ---------- crypto ----------
async function chave(user, pass, salt, it, usos) {

  const ate17 = ida.filter((x) => x[0] <= 17).reduce((s, x) => s + x[1], 0), tid = ida.reduce((s, x) => s + x[1], 0), semIdade = a.length - tid;
  const barras = ida.map(([k, v]) => `<div class="vc"><span class="vn">${v}</span><div class="vb" style="height:${(v / im * 100).toFixed(1)}%"></div><span class="vl">${k}</span></div>`).join('');
  const notaIdade = semIdade ? `<p class="note">${semIdade === 1 ? 'Uma resposta veio sem número e ficou' : semIdade + ' respostas vieram sem número e ficaram'} fora do gráfico.</p>` : '';
  S.push(slide('Quem vai', 'Idade dos inscritos', `<p class="lead">A idade mais comum é ${moda[0]} anos, e ${ate17} dos ${tid} inscritos que informaram a idade têm até 17 anos.</p><div class="vchart">${barras}</div>${notaIdade}`));
  S.push(slide('Quem vai', 'Perfil dos encontristas', `<p class="lead">Entre os ${ne} encontristas confirmados:</p><div class="meters">${medidor('Vêm pela primeira vez ao Encontro', pv, ne)}${medidor('São batizados em igreja evangélica', bz, ne)}</div>`));
  const dg = [['E', 'encontristas', B, '#fff'], ['Q', 'equipe', MUT, INK]];
  const disc = grupos(a, (r) => r.disc).map(([k, g]) => ({ nome: k, E: g.filter((r) => r.lote === 'Encontrista').length, Q: g.filter((r) => r.lote !== 'Encontrista').length })).sort((x, y) => (y.E + y.Q) - (x.E + x.Q));
  S.push(slide('Inscrições por discipulado', 'Por discipulador', `${legenda(dg)}<div class="bars">${hbar(disc, dg, true, 40)}</div>`));
  const lid = grupos(a, (r) => r.lider).map(([k, g]) => [k, g.filter((r) => r.lote === 'Encontrista').length, g.filter((r) => r.lote !== 'Encontrista').length, g.length]).sort((x, y) => (y[3] - x[3]) || (y[1] - x[1]));
  const ltable = (rs) => '<table><tr><th>Líder</th><th class="num">Encontristas</th><th class="num">Equipe</th><th class="num">Total</th></tr>' + rs.map(([n, x, y, t]) => `<tr><td>${esc(n)}</td><td class="num">${x}</td><td class="num">${y}</td><td class="num"><b>${t}</b></td></tr>`).join('') + '</table>';
  const half = Math.ceil(lid.length / 2);
  S.push(slide('Inscrições por discipulado', 'Por líder', `<div class="two">${ltable(lid.slice(0, half))}${ltable(lid.slice(half))}</div><p class="note">Ordenado pelo total de inscritos de cada líder.</p>`));
  const tr = grupos(a, (r) => r.transp).map(([k, g]) => ({ nome: k, n: g.length })).sort((x, y) => y.n - x.n);
  const rs = [...contar(a.filter((r) => r.rest !== 'Nenhuma'), (r) => r.rest)].sort((x, y) => (y[1] - x[1]) || cmp(x[0], y[0]));
  const totRs = rs.reduce((s, x) => s + x[1], 0);
  S.push(slide('Logística', 'Transporte e alimentação', `<div class="two"><div><h3>Transporte até a chácara</h3><div class="bars">${hbar(tr, [['n', 'pessoas', B, '#fff']], true, 44)}</div></div>
<div><h3>Restrições alimentares · ${totRs} pessoas</h3><table><tr><th>Restrição</th><th class="num">Pessoas</th></tr>${rs.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</table></div></div>`));
  const ltab = (rs2) => '<table class="lt"><tr><th>Nome</th><th class="num">Idade</th><th>Discipulador</th><th>Célula</th></tr>' + rs2.map((r) => `<tr><td>${esc(r.nome)}</td><td class="num">${esc(r.idade)}</td><td>${esc(r.discipulador)}</td><td>${esc(r.celula)}</td></tr>`).join('') + '</table>';
  const cards = D.listas.map((g) => `<div class="dcard"><span class="dg">${esc(g.titulo)}</span><span class="dn">${g.linhas.length}</span><span class="dt">${g.com_lote ? 'nome, idade, lote, discipulador e célula' : 'nome, idade, discipulador e célula'}</span><button class="dl" data-baixar="${g.id}" type="button">Baixar lista</button></div>`).join('');
  S.push(slide('Listas', 'Baixar listas de nomes', `<p class="lead" style="font-size:19px">Cada botão baixa uma planilha (abre no Excel) com os nomes em letra maiúscula. Contam só pagamentos aprovados.</p><div class="dgrid">${cards}</div><p class="dlmsg" data-baixar-msg role="status"></p>`, 'downloads'));
  const idxDl = S.length - 1;
  D.listas.forEach((g) => {
    const L = g.linhas, np = Math.max(1, Math.ceil(L.length / 36)), per = Math.max(1, Math.ceil(L.length / np));
    const pags = []; for (let i = 0; i < Math.max(L.length, 1); i += per) pags.push(L.slice(i, i + per));
    pags.forEach((pg, n) => {
      const meio = Math.ceil(pg.length / 2);
      const tit = g.titulo + (pags.length > 1 ? ` (${n + 1}/${pags.length})` : '');
      const topo = `<div class="lhead"><p class="lead">${L.length} pessoas, por discipulador e célula.</p><button class="dl" data-baixar="${g.id}" type="button">Baixar lista</button></div>`;
      S.push(slide('Listas', tit, topo + `<div class="two lt2">${ltab(pg.slice(0, meio))}${ltab(pg.slice(meio))}</div>`));
    });
  });
  return { S, idxDl };
}

const PAINEL_FILTRO = `<section class="flt" id="filtrar" aria-labelledby="flt-t">
  <div class="flt-head"><span class="flt-k">Consulta</span><h2 id="flt-t">Filtrar pessoas</h2><p>Escolha o discipulador e o tipo de inscrição. A lista mostra quem combina com os dois filtros, e o botão baixa exatamente essa lista.</p></div>
  <div class="flt-ctl">
    <label for="f-disc">Discipulador<select id="f-disc"></select></label>
    <label for="f-tipo">Tipo de inscrição<select id="f-tipo"></select></label>
  </div>
  <div class="flt-bar"><p class="flt-n" id="f-n" role="status"></p><div class="flt-act"><button type="button" class="flt-limpar" id="f-limpar">Limpar filtros</button><button type="button" class="flt-dl" id="f-dl">Baixar esta lista</button></div></div>
  <p class="flt-msg" id="f-msg" role="status"></p>
  <div class="flt-tw"><table class="flt-t"><thead><tr><th>Nome</th><th class="num">Idade</th><th>Lote</th><th>Discipulador</th><th>Célula</th><th>Transporte</th></tr></thead><tbody id="f-body"></tbody></table></div>
</section>`;

const PAINEL_ENVIO = `<section class="flt up" id="atualizar" aria-labelledby="up-t" hidden>
  <div class="flt-head"><span class="flt-k">Só para quem atualiza</span><h2 id="up-t">Atualizar com nova planilha</h2><p>Baixe a planilha de ingressos do sistema (arquivo .xlsx) e envie aqui. Você vê o que muda antes de publicar. Ao publicar, o site muda para todos na hora.</p></div>
  <div class="up-row"><label class="up-file" for="up-arq"><span>Escolher planilha</span><input id="up-arq" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><span class="up-nome" id="up-nome">Nenhum arquivo escolhido</span></div>
  <p class="flt-msg" id="up-msg" role="status"></p>
  <div id="up-prev" hidden>
    <div class="flt-tw up-tw"><table class="flt-t"><thead><tr><th>Lista</th><th class="num">Agora no site</th><th class="num">Nova planilha</th><th class="num">Diferença</th></tr></thead><tbody id="up-body"></tbody></table></div>
    <div class="flt-act up-act"><button type="button" class="flt-limpar" id="up-cancelar">Cancelar</button><button type="button" class="flt-dl" id="up-publicar">Publicar no site</button></div>
  </div>
</section>`;

// ---------- downloads ----------
const q = (v) => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = (cab, linhas) => '\ufeff' + [cab].concat(linhas).map((l) => l.map(q).join(';')).join('\r\n');
async function salvar(nome, data, msgs, ok) {
  msgs.forEach((m) => { m.textContent = ''; });
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: nome, data }); msgs.forEach((m) => { m.textContent = ok; }); }
    catch (e) { msgs.forEach((m) => { m.textContent = e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível baixar aqui. Tente pelo navegador do computador.'; }); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
  const el = document.createElement('a'); el.href = url; el.download = nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  msgs.forEach((m) => { m.textContent = ok; });
}
function baixarLista(D, id, msgs) {
  const g = D.listas.find((x) => x.id === id); if (!g) return;
  const cab = g.com_lote ? ['Nome', 'Idade', 'Lote', 'Discipulador', 'Célula'] : ['Nome', 'Idade', 'Discipulador', 'Célula'];
  const linhas = g.linhas.map((r) => g.com_lote ? [r.nome, r.idade, r.lote, r.discipulador, r.celula] : [r.nome, r.idade, r.discipulador, r.celula]);
  salvar(`${g.id}_encontro_${D.stamp}.csv`, csv(cab, linhas), msgs, 'Lista de ' + g.titulo + ' baixada.');
}

// ---------- filtros ----------
function filtros(D) {
  const P = D.pessoas, sel = { disc: $('f-disc'), tipo: $('f-tipo') }, campo = { disc: 'discipulador', tipo: 'tipo' };
  const opcoes = (el, lista, atualV) => {
    el.textContent = '';
    const t = document.createElement('option'); t.value = ''; t.textContent = 'Todos'; el.appendChild(t);
    [...new Set(lista)].sort((x, y) => x.localeCompare(y, 'pt')).forEach((v) => { const o = document.createElement('option'); o.value = v; o.textContent = v; el.appendChild(o); });
    el.value = [...el.options].some((o) => o.value === atualV) ? atualV : '';
  };
  const filtrar = (ign) => P.filter((r) => Object.keys(sel).every((k) => k === ign || !sel[k].value || r[campo[k]] === sel[k].value));
  let vis = [];
  const desenhar = () => {
    Object.keys(sel).forEach((k) => opcoes(sel[k], filtrar(k).map((r) => r[campo[k]]), sel[k].value));
    vis = filtrar();
    const body = $('f-body'); body.textContent = '';
    if (!vis.length) { const tr = document.createElement('tr'); tr.className = 'flt-vazio'; const td = document.createElement('td'); td.colSpan = 6; td.textContent = 'Ninguém combina com esses filtros. Tente tirar algum.'; tr.appendChild(td); body.appendChild(tr); }
    vis.forEach((r) => { const tr = document.createElement('tr'); [r.nome, r.idade, r.lote, r.discipulador, r.celula, r.transporte].forEach((v, i) => { const td = document.createElement('td'); if (i === 1) td.className = 'num'; td.textContent = v; tr.appendChild(td); }); body.appendChild(tr); });
    const n = $('f-n'); n.textContent = ''; const b = document.createElement('b'); b.textContent = vis.length; n.append(b, ' de ' + P.length + ' pessoas');
    $('f-dl').disabled = !vis.length; $('f-msg').textContent = '';
  };
  Object.values(sel).forEach((el) => el.addEventListener('change', desenhar));
  $('f-limpar').addEventListener('click', () => { Object.values(sel).forEach((el) => { el.value = ''; }); desenhar(); });
  $('f-dl').addEventListener('click', () => {
    const partes = Object.keys(sel).filter((k) => sel[k].value).map((k) => norm(sel[k].value).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
    const nome = partes.length ? `pessoas_${partes.join('_')}_${D.stamp}.csv` : `pessoas_todas_${D.stamp}.csv`;
    salvar(nome, csv(['Nome', 'Idade', 'Lote', 'Discipulador', 'Célula', 'Transporte'], vis.map((r) => [r.nome, r.idade, r.lote, r.discipulador, r.celula, r.transporte])), [$('f-msg')], vis.length + ' pessoas baixadas.');
  });
  desenhar();
}

// ---------- envio de planilha ----------
let xlsxPronto = null;
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPronto) xlsxPronto = new Promise((ok, falha) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxPronto = null; falha(new Error('xlsx')); }; document.head.appendChild(s); });
  return xlsxPronto;
}
function lerPlanilha(buf, nomeArq) {
  const wb = window.XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const tab = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  const cab = (tab[0] || []).map((c) => norm(c));
  if (!(cab[COL.lote] || '').includes('lote') || !(cab[COL.status] || '').includes('status') || !(cab[COL.disc] || '').includes('discipulador')) throw new Error('formato');
  const linhas = tab.slice(1).filter((l) => String(l[COL.status] || '').trim()).map((l) => CAMPOS.map((c) => String(l[COL[c]] == null ? '' : l[COL[c]])));
  if (!linhas.length) throw new Error('vazia');
  const m = /_(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.xlsx$/i.exec(nomeArq || '');
  const agora = new Date(), p2 = (n) => String(n).padStart(2, '0');
  const quando = m ? `${m[1]}/${m[2]}/20${m[3]}, ${m[4]}:${m[5]}` : `${p2(agora.getDate())}/${p2(agora.getMonth() + 1)}/${agora.getFullYear()}, ${p2(agora.getHours())}:${p2(agora.getMinutes())}`;
  const stamp = m ? m[1] + m[2] : p2(agora.getDate()) + p2(agora.getMonth() + 1);
  return { quando, stamp, linhas };
}
function documento(dadosCifrados) {
  const reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const conteudo = `<title>${TITULO}</title>\n<link rel="stylesheet" href="${FONTE}">\n<style id="login-css">${LOGIN_CSS}</style>\n<template id="tpl-login">${LOGIN_TPL}</template>\n<div id="raiz"></div>\n<script type="application/json" id="dados">${JSON.stringify(dadosCifrados).replace(/</g, '\\u003c')}<\/script>\n<script id="motor">${MOTOR_SRC}<\/script>\n`;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + conteudo + '</body></html>';
}
async function envio(D) {
  const art = window.claude && window.claude.use ? await window.claude.use('artifact').catch(() => null) : null;
  const usr = window.claude && window.claude.use ? await window.claude.use('user').catch(() => null) : null;
  if (!art || !usr) return;
  let pode = false; try { pode = await usr.canEdit(); } catch (e) { pode = false; }
  if (!pode) return;
  const painel = $('atualizar'); painel.hidden = false;
  const ir = document.querySelector('[data-ir-envio]'); if (ir) { ir.hidden = false; ir.addEventListener('click', () => painel.scrollIntoView({ behavior: 'smooth', block: 'start' })); }
  const msg = $('up-msg'), prev = $('up-prev'), arq = $('up-arq');
  let novo = null;
  const limpar = () => { novo = null; prev.hidden = true; arq.value = ''; $('up-nome').textContent = 'Nenhum arquivo escolhido'; };
  arq.addEventListener('change', async () => {
    const f = arq.files && arq.files[0]; prev.hidden = true; novo = null; msg.textContent = '';
    if (!f) return;
    $('up-nome').textContent = f.name;
    if (!/\.xlsx$/i.test(f.name)) { msg.textContent = 'Esse arquivo não é uma planilha .xlsx. Baixe a planilha de ingressos do sistema e tente de novo.'; return; }
    msg.textContent = 'Lendo a planilha…';
    try { await carregarXLSX(); } catch (e) { msg.textContent = 'Não consegui carregar o leitor de planilhas. Confira a internet e tente de novo.'; return; }
    try { novo = lerPlanilha(await f.arrayBuffer(), f.name); }
    catch (e) { msg.textContent = e.message === 'formato' ? 'Essa planilha não tem as colunas do sistema de ingressos (Lote, Status de Pagamento, discipulador). Envie a exportação original do sistema.' : e.message === 'vazia' ? 'A planilha não tem nenhuma inscrição.' : 'Não consegui ler esse arquivo. Abra no Excel, salve como .xlsx e tente de novo.'; novo = null; return; }
    const N = preparar(novo);
    const linhaTab = (t, x, y) => { const d = y - x; return `<tr><td>${esc(t)}</td><td class="num">${x}</td><td class="num">${y}</td><td class="num"><b>${d > 0 ? '+' + d : d}</b></td></tr>`; };
    const exp = (X) => X.rows.filter((r) => r.status === 'Expirado').length;
    $('up-body').innerHTML = linhaTab('Inscrições confirmadas', D.a.length, N.a.length) + D.listas.map((g, i) => linhaTab(g.titulo, g.linhas.length, N.listas[i].linhas.length)).join('') + linhaTab('Pagamentos expirados', exp(D), exp(N));
    msg.textContent = `Planilha lida: dados de ${N.quando}. Confira os números e clique em Publicar no site.`;
    prev.hidden = false;
  });
  $('up-cancelar').addEventListener('click', () => { limpar(); msg.textContent = 'Envio cancelado. O site continua como estava.'; });
  $('up-publicar').addEventListener('click', async () => {
    if (!novo) return;
    const bt = $('up-publicar'); bt.disabled = true; msg.textContent = 'Publicando…';
    try {
      const cif = await fechar(novo);
      await art.publish(documento(cif));
      msg.textContent = 'Publicado. O site vai recarregar com os dados novos.';
    } catch (e) {
      const c = e && e.code;
      msg.textContent = c === 'conflict' ? 'Outra atualização foi salva ao mesmo tempo. A página vai recarregar; se os números não forem os da sua planilha, envie de novo.'
        : (c === 'not_granted' || c === 'not_writer') ? 'Sua conta não tem permissão para editar este site. Peça ao Yuri acesso de edição.'
        : 'Não consegui publicar agora. Tente de novo em alguns minutos.';
      bt.disabled = false;
    }
  });
}

// ---------- montar ----------
function montar(dados) {
  const D = preparar(dados); atual = D;
  const st = document.createElement('style'); st.textContent = SLIDE_CSS; document.head.appendChild(st);
  const { S, idxDl } = slides(D);
  const frames = S.map((s, i) => `<div class="frame" id="slide-${i + 1}"><div class="scale">${s}</div></div>`);
  const meio = frames.slice(0, idxDl + 1).join('') + PAINEL_FILTRO + frames.slice(idxDl + 1).join('');
  const app = $('app');
  app.innerHTML = `<main class="wrap"><nav class="topnav"><button type="button" class="irdl" data-ir-envio hidden>Atualizar planilha</button><button type="button" class="irdl" data-ir-filtro>Filtrar pessoas</button><button type="button" class="irdl" data-ir-downloads>Baixar listas de nomes</button></nav>${PAINEL_ENVIO}${meio}<p class="foot">Dados do sistema de ingressos de ${esc(D.quando)}. Contam só pagamentos aprovados.</p></main>`;
  app.hidden = false;
  const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.firstElementChild.style.transform = 'scale(' + (f.clientWidth / 1280) + ')'; });
  fit(); window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.wrap'));
  const alvo = document.querySelector('.downloads');
  document.querySelector('[data-ir-downloads]').addEventListener('click', () => alvo.closest('.frame').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  document.querySelector('[data-ir-filtro]').addEventListener('click', () => $('filtrar').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  const msgs = [...document.querySelectorAll('[data-baixar-msg]')];
  document.querySelectorAll('[data-baixar]').forEach((b) => b.addEventListener('click', () => baixarLista(D, b.dataset.baixar, msgs)));
  filtros(D);
  envio(D);
}

function iniciar() {
  const raiz = $('raiz');
  raiz.innerHTML = LOGIN_TPL;
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const b = $('b'), err = $('err'), u = $('u').value, s = $('s').value;
    b.disabled = true; err.textContent = '';
    let dados;
    try { dados = await abrir(u, s); }
    catch (e) { err.textContent = 'Usuário ou senha incorretos. Confira e tente de novo.'; b.disabled = false; return; }
    cred = { user: u, pass: s };
    $('login').remove();
    montar(dados);
  });
}
iniciar();
})();
