let atual = null, cssPosto = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s == null ? '' : s).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x00-\x7f]/g, '').toLowerCase().split(/\s+/).filter(Boolean).join(' ');
const up = (s) => String(s == null ? '' : s).split(/\s+/).filter(Boolean).join(' ').toUpperCase();
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

// ---------- limpeza (mesmas regras da planilha original) ----------
const idade = (v) => { const m = /^\s*(\d+)/.exec(String(v == null ? '' : v)); return m ? parseInt(m[1], 10) : null; };
function restricao(v) {
  const s = String(v == null ? '' : v).trim(), k = norm(s);
  if (['nao', 'nenhuma', 'nops', 'nan', '', 'nada', 'nenhum'].includes(k)) return 'Nenhuma';
  if (k === 'sim, camarao e amendoim') return 'Camarão e amendoim';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const LOTE_CURTO = { 'Encontrista': 'ENCONTRISTA', 'Staff': 'STAFF', 'Líder e líder em treinamento': 'LÍDER', 'Anjo da Guarda': 'ANJO DA GUARDA' };
const GRUPOS = [['encontristas', 'Encontristas', 'Encontrista'], ['staff', 'Staff', 'Staff'], ['lideres', 'Líderes e líderes em treinamento', 'Líder e líder em treinamento'], ['anjos', 'Anjos da Guarda', 'Anjo da Guarda']];

function preparar(dados) {
  const rows = dados.linhas.map((l) => { const r = {}; CAMPOS.forEach((c, i) => { r[c] = l[i] == null ? '' : String(l[i]); }); r.lote = r.lote.trim(); r.status = r.status.trim(); r.disc = r.disc.trim(); r.lider = r.lider.trim(); return r; });
  const aprovNomes = new Set(rows.filter((r) => r.status === 'Aprovado').map((r) => norm(r.nome)));
  rows.forEach((r) => {
    r.idadeN = idade(r.idade); r.rest = restricao(r.rest);
    r.refeita = r.status === 'Aprovado' ? '' : (aprovNomes.has(norm(r.nome)) ? 'Sim' : 'Não');
  });
  const a = rows.filter((r) => r.status === 'Aprovado');
  const linha = (r) => ({ nome: up(r.nome), idade: r.idadeN == null ? '' : r.idadeN, discipulador: up(r.disc), celula: up(r.lider), lote: LOTE_CURTO[r.lote] || up(r.lote),
    transporte: r.transp.includes('nibus') ? 'ÔNIBUS' : r.transp.includes('arro') ? 'CARRO PRÓPRIO' : up(r.transp), tipo: r.lote === 'Encontrista' ? 'ENCONTRISTA' : 'EQUIPE' });
  const ordem = (x, y) => cmp(norm(x.discipulador), norm(y.discipulador)) || cmp(norm(x.celula), norm(y.celula)) || cmp(norm(x.nome), norm(y.nome));
  const listas = GRUPOS.map(([id, titulo, lote]) => ({ id, titulo, linhas: a.filter((r) => r.lote === lote).map(linha).sort(ordem) }));
  listas.push({ id: 'onibus', titulo: 'Vão de ônibus', com_lote: true, linhas: a.filter((r) => r.transp.includes('nibus')).map(linha).sort(ordem) });
  listas.push({ id: 'carro', titulo: 'Vão de carro próprio', com_lote: true, linhas: a.filter((r) => r.transp.includes('arro')).map(linha).sort(ordem) });
  return { rows, a, listas, pessoas: a.map(linha).sort(ordem), quando: dados.quando, stamp: dados.stamp, ev: dados, temIdade: rows.some((r) => r.idadeN != null) };
}

// ---------- slides ----------
function contar(rs, chave) { const m = new Map(); rs.forEach((r) => { const k = chave(r); m.set(k, (m.get(k) || 0) + 1); }); return m; }
function grupos(rs, chave) { const m = new Map(); rs.forEach((r) => { const k = chave(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return [...m.keys()].sort(cmp).map((k) => [k, m.get(k)]); }
function hbar(rows, segs, inside, h) {
  const tot = (r) => segs.reduce((s, g) => s + r[g[0]], 0);
  const mx = Math.max(1, ...rows.map(tot));
  return rows.map((r) => {
    const bars = segs.filter((g) => r[g[0]]).map(([k, l, c, fg]) => {
      const w = r[k] / mx * 100; const txt = inside && w > 22 ? `${r[k]} ${l}` : (inside ? String(r[k]) : '');
      return `<span style="width:${w.toFixed(2)}%;background:${c};color:${fg}">${esc(txt)}</span>`;
    }).join('');
    return `<div class="hb" style="--h:${h}px"><span class="nm">${esc(r.nome)}</span><div class="tr">${bars}</div><span class="n">${tot(r)}</span></div>`;
  }).join('');
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const legenda = (segs) => '<div class="lg">' + segs.map(([, l, c]) => `<span><i style="background:${c}"></i>${esc(cap(l))}</span>`).join('') + '</div>';
const pct = (s, n) => (n ? s / n * 100 : 0);
const medidor = (t, s, n) => `<div class="mt"><div class="top"><span>${esc(t)}</span><b>${s} de ${n}</b></div><div class="bar"><span style="width:${pct(s, n).toFixed(1)}%"></span></div><div class="pct">${Math.round(pct(s, n))}%</div></div>`;

function slides(D) {
  const a = D.a, enc = a.filter((r) => r.lote === 'Encontrista'), eq = a.filter((r) => r.lote !== 'Encontrista'), exp = D.rows.filter((r) => r.status === 'Expirado');
  const ne = enc.length, ratio = ne ? (eq.length / ne).toFixed(1).replace('.', ',') : '0';
  const pv = enc.filter((r) => r.primeira === 'Sim').length, bz = enc.filter((r) => r.batizado === 'Sim').length, pend = exp.filter((r) => r.refeita !== 'Sim').length;
  const Q = D.quando;
  const slide = (kick, titulo, corpo, cls) => `<section class="s ${cls || ''}"><div class="hd"><span class="kk">${esc(kick)}</span><h2>${esc(titulo)}</h2></div><div class="bd">${corpo}</div><div class="ft"><span>Encontro com Deus · Pr. Lucas Ribeiro · ${esc(D.ev.rotulo)}</span><span>Dados de ${esc(Q)} · só pagamentos aprovados</span></div></section>`;

  S.push(slide('Visão geral', 'Os números do encontro', `<div class="kpis">

  const ren = { 'Líder e líder em treinamento': 'Líderes e em treinamento' };
  const sx = [['F', 'mulheres', O, B], ['M', 'homens', B, '#fff']];
  const lote = grupos(a, (r) => r.lote).map(([k, g]) => ({ nome: ren[k] || k, F: g.filter((r) => r.sexo === 'F').length, M: g.filter((r) => r.sexo === 'M').length })).sort((x, y) => (y.F + y.M) - (x.F + x.M));
  const tf = a.filter((r) => r.sexo === 'F').length, tm = a.filter((r) => r.sexo === 'M').length;

  const im = Math.max(1, ...ida.map((x) => x[1]));
  let moda = ida.length ? ida[0] : [0, 0]; ida.forEach((x) => { if (x[1] > moda[1]) moda = x; });
  const ate17 = ida.filter((x) => x[0] <= 17).reduce((s, x) => s + x[1], 0), tid = ida.reduce((s, x) => s + x[1], 0), semIdade = a.length - tid;
  const barras = ida.map(([k, v]) => `<div class="vc"><span class="vn">${v}</span><div class="vb" style="height:${(v / im * 100).toFixed(1)}%"></div><span class="vl">${k}</span></div>`).join('');
  const notaIdade = semIdade ? `<p class="note">${semIdade === 1 ? 'Uma resposta veio sem número e ficou' : semIdade + ' respostas vieram sem número e ficaram'} fora do gráfico.</p>` : '';
  if (tid) S.push(slide('Quem vai', 'Idade dos inscritos', `<p class="lead">A idade mais comum é ${moda[0]} anos, e ${ate17} dos ${tid} inscritos que informaram a idade têm até 17 anos.</p><div class="vchart">${barras}</div>${notaIdade}`));

  const dg = [['E', 'encontristas', B, '#fff'], ['Q', 'equipe', MUT, INK]];
  const disc = grupos(a, (r) => r.disc).map(([k, g]) => ({ nome: k, E: g.filter((r) => r.lote === 'Encontrista').length, Q: g.filter((r) => r.lote !== 'Encontrista').length })).sort((x, y) => (y.E + y.Q) - (x.E + x.Q));
  S.push(slide('Inscrições por discipulado', 'Por discipulador', `${legenda(dg)}<div class="bars">${hbar(disc, dg, true, 40)}</div>`));
  const lid = grupos(a, (r) => r.lider).map(([k, g]) => [k, g.filter((r) => r.lote === 'Encontrista').length, g.filter((r) => r.lote !== 'Encontrista').length, g.length]).sort((x, y) => (y[3] - x[3]) || (y[1] - x[1]));
  const ltable = (rs) => '<table><tr><th>Líder</th><th class="num">Encontristas</th><th class="num">Equipe</th><th class="num">Total</th></tr>' + rs.map(([n, x, y, t]) => `<tr><td>${esc(n)}</td><td class="num">${x}</td><td class="num">${y}</td><td class="num"><b>${t}</b></td></tr>`).join('') + '</table>';

  const tr = grupos(a, (r) => r.transp).map(([k, g]) => ({ nome: k, n: g.length })).sort((x, y) => y.n - x.n);
  const rs = [...contar(a.filter((r) => r.rest !== 'Nenhuma'), (r) => r.rest)].sort((x, y) => (y[1] - x[1]) || cmp(x[0], y[0]));
  const totRs = rs.reduce((s, x) => s + x[1], 0);
  S.push(slide('Logística', 'Transporte e alimentação', `<div class="two"><div><h3>Transporte até a chácara</h3><div class="bars">${hbar(tr, [['n', 'pessoas', B, '#fff']], true, 44)}</div></div>
<div><h3>Restrições alimentares · ${totRs} pessoas</h3><table><tr><th>Restrição</th><th class="num">Pessoas</th></tr>${rs.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</table></div></div>`));
  const TI = D.temIdade;
  const ltab = (rs2) => `<table class="lt${TI ? '' : ' semidade'}"><tr><th>Nome</th>${TI ? '<th class="num">Idade</th>' : ''}<th>Discipulador</th><th>Célula</th></tr>` + rs2.map((r) => `<tr><td>${esc(r.nome)}</td>${TI ? `<td class="num">${esc(r.idade)}</td>` : ''}<td>${esc(r.discipulador)}</td><td>${esc(r.celula)}</td></tr>`).join('') + '</table>';
  const cards = D.listas.map((g) => `<div class="dcard"><span class="dg">${esc(g.titulo)}</span><span class="dn">${g.linhas.length}</span><span class="dt">${(g.com_lote ? ['nome', TI && 'idade', 'lote'] : ['nome', TI && 'idade']).filter(Boolean).join(', ')}, discipulador e célula</span><button class="dl" data-baixar="${g.id}" type="button">Baixar lista</button></div>`).join('');
  S.push(slide('Listas', 'Baixar listas de nomes', `<p class="lead" style="font-size:19px">Cada botão baixa uma planilha (abre no Excel) com os nomes em letra maiúscula. Contam só pagamentos aprovados.</p><div class="dgrid">${cards}</div><p class="dlmsg" data-baixar-msg role="status"></p>`, 'downloads'));
  const idxDl = S.length - 1;
  D.listas.forEach((g) => {

    const pags = []; for (let i = 0; i < Math.max(L.length, 1); i += per) pags.push(L.slice(i, i + per));
    pags.forEach((pg, n) => {
      const meio = Math.ceil(pg.length / 2);
      const tit = g.titulo + (pags.length > 1 ? ` (${n + 1}/${pags.length})` : '');
      const topo = `<div class="lhead"><p class="lead">${L.length} pessoas, por discipulador e célula.</p><button class="dl" data-baixar="${g.id}" type="button">Baixar lista</button></div>`;
      S.push(slide('Listas', tit, topo + `<div class="two lt2">${ltab(pg.slice(0, meio))}${ltab(pg.slice(meio))}</div>`));
    });
  });
  return { S, idxDl };
}

// ---------- downloads ----------
const q = (v) => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csv = (cab, linhas) => '\ufeff' + [cab].concat(linhas).map((l) => l.map(q).join(';')).join('\r\n');
async function salvar(nome, data, msgs, ok) {
  msgs.forEach((m) => { m.textContent = ''; });
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: nome, data }); msgs.forEach((m) => { m.textContent = ok; }); }
    catch (e) { msgs.forEach((m) => { m.textContent = e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível baixar aqui. Tente pelo navegador do computador.'; }); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
  const el = document.createElement('a'); el.href = url; el.download = nome; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  msgs.forEach((m) => { m.textContent = ok; });
}
function baixarLista(D, id, msgs) {
  const g = D.listas.find((x) => x.id === id); if (!g) return;
  const sel = (arr) => arr.filter((x, i) => D.temIdade || i !== 1);
  const cab = sel(g.com_lote ? ['Nome', 'Idade', 'Lote', 'Discipulador', 'Célula'] : ['Nome', 'Idade', 'Discipulador', 'Célula']);
  const linhas = g.linhas.map((r) => sel(g.com_lote ? [r.nome, r.idade, r.lote, r.discipulador, r.celula] : [r.nome, r.idade, r.discipulador, r.celula]));
  salvar(`${g.id}_encontro_${D.stamp}.csv`, csv(cab, linhas), msgs, 'Lista de ' + g.titulo + ' baixada.');
}

// ---------- filtros ----------
function filtros(D) {
  const P = D.pessoas, sel = { disc: $('f-disc'), tipo: $('f-tipo') }, campo = { disc: 'discipulador', tipo: 'tipo' };
  const opcoes = (el, lista, atualV) => {
    el.textContent = '';
    const t = document.createElement('option'); t.value = ''; t.textContent = 'Todos'; el.appendChild(t);
    [...new Set(lista)].sort((x, y) => x.localeCompare(y, 'pt')).forEach((v) => { const o = document.createElement('option'); o.value = v; o.textContent = v; el.appendChild(o); });
    el.value = [...el.options].some((o) => o.value === atualV) ? atualV : '';
  };
  const filtrar = (ign) => P.filter((r) => Object.keys(sel).every((k) => k === ign || !sel[k].value || r[campo[k]] === sel[k].value));
  let vis = [];
  const desenhar = () => {
    Object.keys(sel).forEach((k) => opcoes(sel[k], filtrar(k).map((r) => r[campo[k]]), sel[k].value));
    vis = filtrar();
    const body = $('f-body'); body.textContent = '';
    if (!vis.length) { const tr = document.createElement('tr'); tr.className = 'flt-vazio'; const td = document.createElement('td'); td.colSpan = D.temIdade ? 6 : 5; td.textContent = 'Ninguém combina com esses filtros. Tente tirar algum.'; tr.appendChild(td); body.appendChild(tr); }
    vis.forEach((r) => { const tr = document.createElement('tr'); [r.nome, r.idade, r.lote, r.discipulador, r.celula, r.transporte].forEach((v, i) => { if (i === 1 && !D.temIdade) return; const td = document.createElement('td'); if (i === 1) td.className = 'num'; td.textContent = v; tr.appendChild(td); }); body.appendChild(tr); });
    const n = $('f-n'); n.textContent = ''; const b = document.createElement('b'); b.textContent = vis.length; n.append(b, ' de ' + P.length + ' pessoas');
    $('f-dl').disabled = !vis.length; $('f-msg').textContent = '';
  };
  if (!D.temIdade) { const th = document.querySelector('.flt-t thead th:nth-child(2)'); if (th) th.remove(); }
  Object.values(sel).forEach((el) => el.addEventListener('change', desenhar));
  $('f-limpar').addEventListener('click', () => { Object.values(sel).forEach((el) => { el.value = ''; }); desenhar(); });
  $('f-dl').addEventListener('click', () => {
    const partes = Object.keys(sel).filter((k) => sel[k].value).map((k) => norm(sel[k].value).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
    const nome = partes.length ? `pessoas_${partes.join('_')}_${D.stamp}.csv` : `pessoas_todas_${D.stamp}.csv`;
    const tira = (arr) => arr.filter((x, i) => D.temIdade || i !== 1);
    salvar(nome, csv(tira(['Nome', 'Idade', 'Lote', 'Discipulador', 'Célula', 'Transporte']), vis.map((r) => tira([r.nome, r.idade, r.lote, r.discipulador, r.celula, r.transporte]))), [$('f-msg')], vis.length + ' pessoas baixadas.');
  });
  desenhar();
}

// ---------- envio de planilha ----------
let xlsxPronto = null;
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPronto) xlsxPronto = new Promise((ok, falha) => { const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxPronto = null; falha(new Error('xlsx')); }; document.head.appendChild(s); });
  return xlsxPronto;
}
function linhasDeTabela(tab) {
  const cab = (tab[0] || []).map((c) => norm(c));
  const idx = {}; CAMPOS.forEach((c) => { idx[c] = cab.findIndex((h) => CAB[c](h)); });
  if (OBRIG.some((c) => idx[c] < 0)) throw new Error('formato');
  const linhas = tab.slice(1).filter((l) => String(l[idx.status] || '').trim()).map((l) => CAMPOS.map((c) => idx[c] < 0 ? '' : String(l[idx[c]] == null ? '' : l[idx[c]])));
  if (!linhas.length) throw new Error('vazia');
  return linhas;
}
function quandoDoNome(nomeArq) {
  const agora = new Date(), p2 = (n) => String(n).padStart(2, '0');
  const m = /_(\d{2})(\d{2})(\d{2})_?(\d{2})(\d{2})\.xlsx$/i.exec(nomeArq || '');
  return m ? { quando: `${m[1]}/${m[2]}/20${m[3]}, ${m[4]}:${m[5]}`, stamp: m[1] + m[2] }
    : { quando: `${p2(agora.getDate())}/${p2(agora.getMonth() + 1)}/${agora.getFullYear()}, ${p2(agora.getHours())}:${p2(agora.getMinutes())}`, stamp: p2(agora.getDate()) + p2(agora.getMonth() + 1) };
}
function lerPlanilha(buf, nomeArq) {
  const wb = window.XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const tab = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  return Object.assign({ linhas: linhasDeTabela(tab) }, quandoDoNome(nomeArq));
}
function documento(dados) {
  const reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const conteudo = `<title>${TITULO}</title>\n<link rel="stylesheet" href="${FONTE}">\n<style id="base-css">${BASE_CSS}</style>\n<div id="raiz"></div>\n<div id="app" hidden></div>\n<script type="application/json" id="dados">${JSON.stringify(dados).replace(/</g, '\\u003c')}<\/script>\n<script id="motor">${MOTOR_SRC}<\/script>\n`;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' + conteudo + '</body></html>';
}
async function envio(D) {
  const art = window.claude && window.claude.use ? await window.claude.use('artifact').catch(() => null) : null;
  const usr = window.claude && window.claude.use ? await window.claude.use('user').catch(() => null) : null;
  if (!art || !usr) return;
  let pode = false; try { pode = await usr.canEdit(); } catch (e) { pode = false; }
  if (!pode) return;
  const painel = $('atualizar'); painel.hidden = false;
  const ir = document.querySelector('[data-ir-envio]'); if (ir) { ir.hidden = false; ir.addEventListener('click', () => painel.scrollIntoView({ behavior: 'smooth', block: 'start' })); }
  const msg = $('up-msg'), prev = $('up-prev'), arq = $('up-arq');
  let novo = null;
  const limpar = () => { novo = null; prev.hidden = true; arq.value = ''; $('up-nome').textContent = 'Nenhum arquivo escolhido'; };
  arq.addEventListener('change', async () => {
    const f = arq.files && arq.files[0]; prev.hidden = true; novo = null; msg.textContent = '';
    if (!f) return;
    $('up-nome').textContent = f.name;
    if (!/\.xlsx$/i.test(f.name)) { msg.textContent = 'Esse arquivo não é uma planilha .xlsx. Baixe a planilha de ingressos do sistema e tente de novo.'; return; }
    msg.textContent = 'Lendo a planilha…';
    try { await carregarXLSX(); } catch (e) { msg.textContent = 'Não consegui carregar o leitor de planilhas. Confira a internet e tente de novo.'; return; }
    try { novo = lerPlanilha(await f.arrayBuffer(), f.name); }
    catch (e) { msg.textContent = e.message === 'formato' ? 'Essa planilha não tem as colunas do sistema de ingressos (Lote, nome, situação do pagamento, discipulador e líder). Envie a exportação original do sistema.' : e.message === 'vazia' ? 'A planilha não tem nenhuma inscrição.' : 'Não consegui ler esse arquivo. Abra no Excel, salve como .xlsx e tente de novo.'; novo = null; return; }
    const N = preparar(novo);
    const linhaTab = (t, x, y) => { const d = y - x; return `<tr><td>${esc(t)}</td><td class="num">${x}</td><td class="num">${y}</td><td class="num"><b>${d > 0 ? '+' + d : d}</b></td></tr>`; };
    const exp = (X) => X.rows.filter((r) => r.status === 'Expirado').length;
    $('up-body').innerHTML = linhaTab('Inscrições confirmadas', D.a.length, N.a.length) + D.listas.map((g, i) => linhaTab(g.titulo, g.linhas.length, N.listas[i].linhas.length)).join('') + linhaTab('Pagamentos expirados', exp(D), exp(N));
    msg.textContent = `Planilha lida: dados de ${N.quando}. Ela vai atualizar o ${D.ev.titulo}. Confira os números e clique em Publicar no site.`;
    prev.hidden = false;
  });
  $('up-cancelar').addEventListener('click', () => { limpar(); msg.textContent = 'Envio cancelado. O site continua como estava.'; });
  $('up-publicar').addEventListener('click', async () => {
    if (!novo) return;
    const bt = $('up-publicar'); bt.disabled = true; msg.textContent = 'Publicando…';
    try {
      const novoDados = { eventos: DADOS.eventos.map((e) => e.id === D.ev.id ? Object.assign({}, e, novo) : e) };
      await art.publish(documento(novoDados));
      msg.textContent = 'Publicado. O site vai recarregar com os dados novos.';
    } catch (e) {
      const c = e && e.code;
      msg.textContent = c === 'conflict' ? 'Outra atualização foi salva ao mesmo tempo. A página vai recarregar; se os números não forem os da sua planilha, envie de novo.'
        : (c === 'not_granted' || c === 'not_writer') ? 'Sua conta não tem permissão para editar este site. Peça ao Yuri acesso de edição.'
        : 'Não consegui publicar agora. Tente de novo em alguns minutos.';
      bt.disabled = false;
    }
  });
}

// ---------- montar ----------
function postarCss() { if (cssPosto) return; const st = document.createElement('style'); st.textContent = SLIDE_CSS; document.head.appendChild(st); cssPosto = true; }
function montar(ev) {
  const D = preparar(ev); atual = D;
  postarCss();
  $('raiz').hidden = true;
  const { S, idxDl } = slides(D);
  const frames = S.map((s, i) => `<div class="frame" id="slide-${i + 1}"><div class="scale">${s}</div></div>`);
  const meio = frames.slice(0, idxDl + 1).join('') + PAINEL_FILTRO + frames.slice(idxDl + 1).join('');
  const outros = DADOS.eventos.length > 1;
  const app = $('app');
  app.innerHTML = `<main class="wrap"><div class="evbar"><div class="evnome"><span>Evento</span><b>${esc(D.ev.titulo)}</b></div>${outros ? '<button type="button" class="irdl evtroca" data-trocar>Trocar encontro</button>' : ''}</div><nav class="topnav"><button type="button" class="irdl" data-ir-envio hidden>Atualizar planilha</button><button type="button" class="irdl" data-ir-filtro>Filtrar pessoas</button><button type="button" class="irdl" data-ir-downloads>Baixar listas de nomes</button></nav>${PAINEL_ENVIO}${meio}<p class="foot">Dados do sistema de ingressos de ${esc(D.quando)}. Contam só pagamentos aprovados.</p></main>`;
  app.hidden = false;
  window.scrollTo(0, 0);
  const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.firstElementChild.style.transform = 'scale(' + (f.clientWidth / 1280) + ')'; });
  fit(); window.onresize = fit;
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.wrap'));
  const alvo = document.querySelector('.downloads');
  document.querySelector('[data-ir-downloads]').addEventListener('click', () => alvo.closest('.frame').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  document.querySelector('[data-ir-filtro]').addEventListener('click', () => $('filtrar').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  const tr = document.querySelector('[data-trocar]'); if (tr) tr.addEventListener('click', escolher);
  const msgs = [...document.querySelectorAll('[data-baixar-msg]')];
  document.querySelectorAll('[data-baixar]').forEach((b) => b.addEventListener('click', () => baixarLista(D, b.dataset.baixar, msgs)));
  filtros(D);
  envio(D);
}

function escolher() {
  const app = $('app'); app.hidden = true; app.innerHTML = '';
  const raiz = $('raiz'); raiz.hidden = false;
  const cards = DADOS.eventos.map((e) => {
    const D = preparar(e), enc = D.a.filter((r) => r.lote === 'Encontrista').length;
    return `<button type="button" class="evcard" data-ev="${esc(e.id)}"><span class="evtag">${esc(e.selo || '')}</span><b>${esc(e.titulo)}</b><span class="evnum"><em>${D.a.length}</em> inscrições confirmadas</span><span class="evsub">${enc} encontristas · dados de ${esc(e.quando)}</span><span class="evir">Abrir</span></button>`;
  }).join('');
  raiz.innerHTML = `<div class="esc"><div class="esc-blob"></div><div class="esc-in"><div class="esc-k">Encontro com Deus · Pr. Lucas Ribeiro</div><div class="esc-stack"><span>Inscrições</span><span class="sm">Escolha o encontro</span></div><div class="esc-cards">${cards}</div></div></div>`;
  raiz.querySelectorAll('[data-ev]').forEach((b) => b.addEventListener('click', () => { const e = DADOS.eventos.find((x) => x.id === b.dataset.ev); if (e) montar(e); }));
  window.scrollTo(0, 0);
}
escolher();
})();
</script>
</body></html>
