<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscrições Encontro com Deus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1f4fe0; color: #fff; min-height: 100%; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; overflow: hidden; }
.login::before { content: ""; position: absolute; right: -160px; top: -120px; width: 520px; height: 520px; border-radius: 46% 54% 40% 60%; background: #f7a21b; }
.box { position: relative; width: 100%; max-width: 380px; background: #fff; color: #14183a; border-radius: 12px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px; }
.tag { display: inline-block; align-self: flex-start; background: #f7a21b; color: #1f4fe0; font-weight: 900; text-transform: uppercase; font-size: 26px; line-height: .95; padding: 4px 10px 6px; transform: rotate(-2deg); }
.box p { margin: 0; color: #5a6480; font-size: 14px; }
label { font-size: 13px; font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid #c9d3ee; border-radius: 8px; color: #14183a; background: #fff; }
input:focus { outline: 3px solid rgba(31,79,224,.25); border-color: #1f4fe0; }
.entrar { font: inherit; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; background: #1f4fe0; color: #fff; border: 0; border-radius: 8px; padding: 12px; cursor: pointer; }
.entrar:focus-visible { outline: 3px solid #f7a21b; outline-offset: 2px; }
.entrar[disabled] { opacity: .6; cursor: wait; }
.err { color: #c62f1a; font-size: 13px; min-height: 1.2em; margin: 0; }
</style></head>
<body>
<div class="login" id="login">
  <form class="box" id="form" autocomplete="on">
    <span class="tag">Encontro<br>com Deus</span>
    <p>Inscrições · acesso restrito à rede</p>
    <label for="u">Usuário<input id="u" name="username" autocomplete="username" required></label>
    <label for="s">Senha<input id="s" name="password" type="password" autocomplete="current-password" required></label>
    <button class="entrar" id="b" type="submit">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<div id="app" hidden></div>

const u8 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(user, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(D.salt), iterations: D.it }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function csvDe(lista, comLote) {
  const q = (v) => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const cab = comLote ? ['Nome', 'Idade', 'Lote', 'Discipulador', 'Célula'] : ['Nome', 'Idade', 'Discipulador', 'Célula'];
  const linhas = [cab].concat(lista.map(r => comLote ? [r.nome, r.idade, r.lote, r.discipulador, r.celula] : [r.nome, r.idade, r.discipulador, r.celula]));
  return '\ufeff' + linhas.map(l => l.map(q).join(';')).join('\r\n');
}
async function baixar(c, id, msg) {
  const g = c.listas[id]; if (!g) return;
  const data = csvDe(g.linhas, g.com_lote);
  msg.forEach(m => m.textContent = '');
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: g.arquivo, data }); msg.forEach(m => m.textContent = 'Lista de ' + g.titulo + ' baixada.'); }
    catch (e) { msg.forEach(m => m.textContent = e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível baixar aqui. Tente pelo navegador do computador.'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = g.arquivo; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  msg.forEach(m => m.textContent = 'Lista de ' + g.titulo + ' baixada.');
}
function mostrar(c) {
  const st = document.createElement('style'); st.textContent = c.css; document.head.appendChild(st);
  const app = document.getElementById('app'); app.innerHTML = c.html; app.hidden = false;
  document.getElementById('login').remove();
  const fit = () => document.querySelectorAll('.frame').forEach(f => { f.firstElementChild.style.transform = 'scale(' + (f.clientWidth / 1280) + ')'; });
  fit(); window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.wrap'));
  const alvo = document.querySelector('.downloads'); const ir = document.querySelector('[data-ir-downloads]');
  if (ir && alvo) ir.addEventListener('click', () => alvo.closest('.frame').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  const msgs = [...document.querySelectorAll('[data-baixar-msg]')];
  document.querySelectorAll('[data-baixar]').forEach(b => b.addEventListener('click', () => baixar(c, b.dataset.baixar, msgs)));
}
document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try { mostrar(await abrir(document.getElementById('u').value, document.getElementById('s').value)); }
  catch (e) { err.textContent = 'Usuário ou senha incorretos. Confira e tente de novo.'; b.disabled = false; }
});
